# Dependabot version updates: gomod ecosystem. The Go module lives at go/
# (go.mod declares `go 1.26`, zero third-party requires — stdlib-only policy,
# docs/go-implementation-plan.md §1.3), so this keeps module-level and
# toolchain updates tracked. Weekly cadence, at most 5 open PRs.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/go"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

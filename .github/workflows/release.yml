# Consema Go release: tag-triggered verification + GitHub release.
#
# Go has no build/publish step — pushing tag vX.Y.Z IS the release. The
# release artifact is the GitHub Release (tag + auto-generated notes); the
# Go proxy (proxy.golang.org) can only pick the module up once the
# consema.dev domain resolves (DNS + vanity import meta tags) and the
# module-path/vcs layout is ready — until then `go get
# consema.dev/consema` is not proxy-served (G108, adversarial audit
# 2026-08-13; module consema.dev/consema, module docs from go/README.md).
# This workflow therefore (1) re-runs the gate suite on the exact tag
# (gofmt + vet + build + test + race, with the conformance data provisioned
# from the consema spec repository exactly like ci-go.yml), (2) runs the
# four cross-language differential harnesses on the tag (G106: release-path
# parity gate, mirroring ci-go.yml's go-differential job) and (3) creates a
# GitHub release with auto-generated notes. goreleaser binary releases are
# a P2 option (see RELEASING.md §3), deliberately not wired here.
name: Release (tag + GitHub release)

on:
  push:
    tags: ['v*']

# G122 (adversarial audit, 2026-08-14): one release run per tag — a re-push
# or continued run while the previous run is still going would start a
# second concurrent publish (mirrors the consema-rs release.yml shape).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: go gates on tag (gofmt + vet + build + test + race)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # G111 (adversarial audit, 2026-08-13; pin advanced 2026-08-14,
      # G070/G080; re-anchored 2026-08-15 F2): the spec-repository
      # checkout is pinned to the commit that carries the cfd6e296 vector
      # inventory, so the release-time provision and the go-module pinned
      # digest always agree. The pin is ccc9943 (wave-4 R5, re-anchored
      # to mother-repo HEAD after b8bf4cb's R40 field-anchor evidence
      # rework; same cfd6e296 aggregate digest; fc-manifest sha256
      # 5cb4ab51… asserted after provision) and all four language repos
      # pin it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: consema/consema
          ref: ccc99430a6e3003bc1b0830d81cbad245323f0a4 # wave-4 R5 unified provision pin, F2 re-anchored to mother-repo HEAD (fc-manifest sha256 5cb4ab51 asserted)
          path: consema-repo
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
          # setup-go v5 enables the Go build cache by default; a poisoned
          # cache entry must never influence a published artifact, so the
          # cache is disabled on this tag-triggered publishing workflow
          # (zizmor cache-poisoning).
          cache: false
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # Wave-4 R5 manifest sha256 assertion (unified provision pin
          # ccc9943): the pinned checkout must carry exactly the digest
          # recorded at the pin — silent manifest drift fails the job.
          $expectedDigest = '5cb4ab518cc3b3e1754a07f21953693b4b9ec113443d44c6ed8a6d4fa8faa6f8'
          $actualDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json')).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "fc-manifest sha256 mismatch after provision: expected $expectedDigest, got $actualDigest"
          }
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      # Release guard (rc 前六角色审计 P1, 2026-08-12; G106 extension,
      # 2026-08-13): the tag must point at a commit on origin/main's history
      # — a tag pushed from a stale or divergent commit must not publish —
      # and, because Go has no go.mod package version, the tag minus the
      # leading v must equal the repo-root README.md "Version:" line (the
      # check-version-consistency authority), otherwise a mismatched tag
      # could publish the wrong version.
      # G071 (adversarial audit, 2026-08-14): the guard previously compared
      # HEAD against the job-time origin/main HEAD — a commit landing on
      # main between the tag push and this step made a valid tag fail and
      # forced a force re-push. The tag's commit is fixed at push time
      # ($GITHUB_SHA), so the ancestor check is race-free: the tagged commit
      # must be an ancestor of main (on its history), not a divergent
      # branch.
      # R7 (wave-4 ruling, 2026-08-15): the tag object is peeled with
      # ^{commit} before the ancestor check — for an annotated tag push
      # $GITHUB_SHA is the tag object's SHA, not the commit's, and the
      # unpeeled check would wrongly reject it (a lightweight tag push
      # carries the commit SHA directly, so the peel is a no-op there; the
      # guard now accepts both tag shapes). The guard also enforces the
      # same 24 h recency window as the consema-rs release guard: a tag
      # commit older than 24 h relative to the current main HEAD is a
      # genuinely stale tag and fails (a stale-but-ancestral commit could
      # otherwise publish old code).
      - name: verify tag points at a commit on origin/main (peeled, recency window)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          tag_commit="${GITHUB_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$tag_commit" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME does not point at a commit on origin/main (peeled $tag_commit)"
            exit 1
          fi
          main_head="$(git rev-parse FETCH_HEAD)"
          tag_ts="$(git show -s --format=%ct "$tag_commit")"
          main_ts="$(git show -s --format=%ct "$main_head")"
          if (( main_ts - tag_ts > 86400 )); then
            echo "::error::tag $GITHUB_REF_NAME is stale: its commit ($tag_commit, $tag_ts) is more than 24 h older than the current main HEAD ($main_head, $main_ts) — a genuinely stale tag must not publish (R7, wave-4 2026-08-15)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME points at a commit on origin/main (peeled $tag_commit, within the 24 h recency window)"
      - name: verify tag matches manifest version (README Version line)
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(sed -n 's/^Version: *//p' README.md | sed 's/[（(].*//' | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "$manifest" ]]; then
            echo "::error::could not read Version from README.md"
            exit 1
          fi
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match README.md Version $manifest"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches README Version $manifest"
      # G064 (adversarial audit, 2026-08-13): the assignment inside the &&
      # chain carries gofmt's exit status (the old `test -z "$(gofmt -l .)"`
      # swallowed it).
      # G027/W3-32 (adversarial audit, 2026-08-14): -count=1 disables the Go
      # test result cache — a cached "ok (cached)" replay could skip the
      # conformance digest/case-count assertions after provisioning (the
      # race leg already runs -shuffle=on, which bypasses the cache); same
      # form as ci-go.yml go-matrix.
      # R13 (wave-4 ruling, 2026-08-15): the -tags release legs compile and
      # test the release-tagged variant (apply_injections_release.go) on
      # the exact tag — same legs as ci-go.yml go-matrix, so G114's
      # injection-seam-compiled-out claim is verified on the release path.
      - name: gofmt gate (real failure semantics) && go vet && go build && go test -count=1 && go test -race -shuffle=on && go build -tags release && go test -tags release -count=1
        run: cd go && out="$(gofmt -l .)" && test -z "$out" && go vet ./... && go build ./... && go test -count=1 ./... && go test -race -shuffle=on ./... && go build -tags release ./... && go test -tags release -count=1 ./...

  # G106 (adversarial audit, 2026-08-13): the release path previously ran
  # only the Go-side gates — the four cross-language differential harnesses
  # (byte parity / normalized / protocol exchange / shared conformance, the
  # roadmap §16.6 hard gate) never ran on a tag. This job mirrors
  # ci-go.yml's go-differential job exactly (same checkouts, provision and
  # harness steps) so a released tag carries the same cross-language parity
  # evidence as a merged PR. The spec-repository checkout is pinned to
  # ccc9943 (the wave-4 R5 unified provision pin re-anchored by F2,
  # G111/G070/G080/R5).
  differential:
    name: go differential on tag (byte parity + normalized + protocol exchange + shared conformance)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # G070 (adversarial audit, 2026-08-14): the Rust emitter workspace
          # is ref-pinned for reproducibility (same pin as ci-go.yml and the
          # py/ts/kt repos).
          repository: consema/consema-rs
          ref: bd5734eab969fa7c8a1a1564d4ee50b85f3d10d6 # cfd6e296 519-case vendored conformance + emitter pin
          path: consema-rs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: ccc99430a6e3003bc1b0830d81cbad245323f0a4 # wave-4 R5 unified provision pin, F2 re-anchored to mother-repo HEAD (fc-manifest sha256 5cb4ab51 asserted)
          path: consema-repo
      # G070 (adversarial audit, 2026-08-14): the Rust emitter toolchain is
      # pinned to 1.97.1 — the version this harness was locally verified
      # with (钉定本机实测版本), so the differential goldens are
      # bit-reproducible (位级可复现) and independent of the runner's
      # current stable; same pin as ci-go.yml. No rust-cache (R10/W3-31,
      # adversarial audit 2026-08-14): this tag-triggered publishing
      # workflow disables caches on the verify path (zizmor
      # cache-poisoning), so the differential path carries the same threat
      # model — a poisoned cache entry must never influence a published
      # tag's cross-language parity evidence.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
          # R10/W3-31 (adversarial audit, 2026-08-14): same cache-poisoning
          # rationale as the verify job — setup-go v5 enables the Go build
          # cache by default, and a poisoned cache entry must never
          # influence a published artifact, so the cache is disabled on
          # this tag-triggered publishing workflow (zizmor
          # cache-poisoning).
          cache: false
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # Wave-4 R5 manifest sha256 assertion (unified provision pin
          # ccc9943): the pinned checkout must carry exactly the digest
          # recorded at the pin — silent manifest drift fails the job.
          $expectedDigest = '5cb4ab518cc3b3e1754a07f21953693b4b9ec113443d44c6ed8a6d4fa8faa6f8'
          $actualDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json')).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "fc-manifest sha256 mismatch after provision: expected $expectedDigest, got $actualDigest"
          }
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      - name: scripts/go-verify-byte-parity.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/go-verify-byte-parity.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/go-verify-normalized-differential.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/go-verify-normalized-differential.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/go-verify-protocol-exchange.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/go-verify-protocol-exchange.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/go-verify-shared-conformance.ps1 -StrictSkips
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/go-verify-shared-conformance.ps1'
          & $script -StrictSkips
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  github-release:
    name: create GitHub release (auto-generated notes)
    needs: [verify, differential]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: create GitHub release for the tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true

# Consema Go SDK gates (roadmap §16.1 "Rust 与 Go 的 PVCE/PGCE bytes 完全
# 一致", §16.2, §16.6; https://github.com/consema/consema/blob/main/docs/go-implementation-plan.md
# §4.4; the §14.12 "differential" gate plan). Seven jobs:
#
#   go-matrix: the Go minimum-version gates (gofmt/vet/build/test/race,
#            §21.2 "最低版本 CI 验证"), a 2-version matrix
#            ('1.26.0' declared minimum + '1.26.5' current stable,
#            fail-fast: false) per RFC 0020 §9.2 ("CI runs the module on the
#            declared minimum and on current stable"). go.mod declares
#            `go 1.26` (frozen at 0.14.0; RFC 0020 §9.2, support-policy.md
#            §2); the minimum leg is the exact 1.26.0 patch so the declared
#            minimum is genuinely exercised (G031, adversarial audit
#            2026-08-14: '1.26.x' resolved to the latest 1.26 patch — both
#            legs sat on the same minor line and the true minimum 1.26.0 was
#            never verified). Each leg pins its setup-go version and runs
#            genuinely, with no GOTOOLCHAIN auto-switch. `go test ./...` runs the
#            conformance runner (go/conformance, repository-relative paths),
#            so this job also uses the multi-repo checkout mode: it checks
#            out consema/consema (the spec repository) beside this
#            repository and provisions the conformance data
#            (conformance/vectors + fixtures, the
#            docs/fc-manifest-0.13.0.json; the toml.corpus.cargo-manifest
#            corpus reads the committed fixture
#            conformance/fixtures/toml/Cargo.toml).
#   coverage: the statement-coverage gate (go test -coverprofile +
#            go tool cover -func; initial threshold 60% — conservative,
#            tightened as coverage improves). Like go-matrix, `go test ./...`
#            runs the conformance runner, so the job uses the multi-repo
#            checkout mode and provisions the conformance data the same way.
#   go-differential: the cross-language differential gates. This repository
#            carries the Go implementation only, so the job uses the
#            multi-repo checkout mode: it checks out consema/consema-rs
#            (the Rust emitter workspace) and consema/consema (the spec
#            repository, whose conformance/differential case sets are the
#            single authority) beside this repository, copies the conformance
#            data into the workspace root, and runs the go-verify-*.ps1
#            harnesses. The scripts build the pinned Rust emitter examples
#            (cargo build --locked -p consema-conformance --example …),
#            provision the golden/evidence directories, run the Go
#            differential tests with the golden env vars set, close the
#            reverse directions, and fail on any divergence. The fourth
#            harness (go-verify-shared-conformance.ps1) runs the same 18
#            vector suites with both runners in one batch and compares the
#            reports case by case — the roadmap §16.6 hard gate — so it is
#            wired into this job's PR execution path (the tag-triggered
#            release path runs the same four harnesses in release.yml's
#            differential job).
#   govulncheck: the standing dependency audit (the official Go vulnerability
#            scanner, golang.org/x/vuln; G135, 2026-08-13 — the job is
#            defined here so the aggregate check can include it; a needs
#            entry must name a job in the same workflow). The go.mod surface
#            is zero-require today; the scanner is wired now so the day a
#            dependency enters go.mod the standing gate is already running.
#            The daily-cron track lives in audit.yml (the schedule is split
#            into a separate workflow so the aggregate check's `needs` can
#            name the audit job inside the same workflow — G099, adversarial
#            audit 2026-08-14: "a schedule ci-go.yml cannot express" was a
#            false causal claim; any workflow may declare schedule and
#            push/pull_request side by side).
#   check-version-consistency: asserts the README release-train "Version:"
#            line (go.mod declares no package version, so the line is the
#            train bump's CI hook) and that the conformance CLI pins the
#            same value in go/cmd/consema-conformance/main.go.
#   examples: vets and runs the committed go/examples/sdk_chain example (no
#            conformance data, so no multi-repo checkout or provision step).
#   check: the alls-green aggregate gate ("check (all gates green)", the
#            SINGLE required check for branch protection; depends on the
#            other six jobs and runs with `if: always()`).
#
# The scripts are Windows PowerShell 5.1 compatible and locate the Rust
# example binary under <consema-rs checkout>\target\debug\examples, so the
# job runs on windows-latest (the ts-differential precedent,
# ci-typescript.yml). A script failure fails the job (no continue-on-error).
name: CI Go

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

# Top-tier P0: minimal token scope. Every job here only reads repository
# contents (checkout + multi-repo checkouts + running repo scripts); none
# uploads artifacts or writes check runs, so the global minimum suffices.
permissions:
  contents: read

jobs:
  go-matrix:
    name: Go ${{ matrix.go }} gates (gofmt + vet + build + test + race)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.0', '1.26.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # G070 (adversarial audit, 2026-08-14): the spec-repository checkout
      # is ref-pinned — the provisioned conformance data must be
      # reproducible, not whatever live HEAD happens to carry when the job
      # runs. The pin is 9aa6597 (wave-4 R5, 2026-08-15): the mother-repo
      # HEAD carrying all wave-3/wave-4 manifest+conformance fixes (incl.
      # the plist-macos-v1 skip truthing, W3-02); same cfd6e296 aggregate
      # digest; fc-manifest sha256 3fdf9a77… asserted after every provision
      # (R5). All four language repos pin it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: 9aa65976d51d27f93afcffca957475368a69e93b # wave-4 unified provision pin (mother-repo HEAD; fc-manifest sha256 3fdf9a77 asserted)
          path: consema-repo
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # Wave-4 R5 manifest sha256 assertion (unified provision pin
          # 9aa6597): the pinned checkout must carry exactly the digest
          # recorded at the pin — silent manifest drift fails the job.
          $expectedDigest = '3fdf9a77323705dfaf24e8f3a822b9217da20dd243e668165f4d06a9ea64676d'
          $actualDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json')).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "fc-manifest sha256 mismatch after provision: expected $expectedDigest, got $actualDigest"
          }
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      # G064 (adversarial audit, 2026-08-13): `test -z "$(gofmt -l .)"` only
      # substitutes stdout — gofmt's own exit code was swallowed and a
      # failing gofmt (non-zero rc, empty stdout) passed the gate. Assign
      # the substitution inside the && chain so the assignment carries
      # gofmt's exit status.
      # G027 (adversarial audit, 2026-08-14): -count=1 disables the Go test
      # result cache — with setup-go's cache restored, a cached "ok (cached)"
      # replay could skip the conformance digest/case-count assertions after
      # provisioning (the race leg already runs -shuffle=on, which bypasses
      # the cache).
      - name: gofmt gate (real failure semantics) && go vet && go build && go test -count=1 && go test -race -shuffle=on
        run: cd go && out="$(gofmt -l .)" && test -z "$out" && go vet ./... && go build ./... && go test -count=1 ./... && go test -race -shuffle=on ./...

  # Coverage gate (gate plan §4 M3 standing toolchain; roadmap §18.3
  # "Coverage 不替代语义证明"): go test measures the whole module with the
  # profile flag and `go tool cover -func` reports the statement total; the
  # awk assertion fails the job when the total drops below 60% (initial
  # threshold, tightened as coverage improves). Like go-matrix, `go test
  # ./...` runs the conformance runner (go/conformance, repository-relative
  # paths), so this job uses the multi-repo checkout mode and provisions the
  # conformance data exactly as the go-matrix job does.
  coverage:
    name: coverage (go test -coverprofile, total >= 60%)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # G070 (adversarial audit, 2026-08-14): ref-pinned spec checkout for
      # reproducible provisioned conformance data (same pin as go-matrix).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: 9aa65976d51d27f93afcffca957475368a69e93b # wave-4 unified provision pin (mother-repo HEAD; fc-manifest sha256 3fdf9a77 asserted)
          path: consema-repo
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # Wave-4 R5 manifest sha256 assertion (unified provision pin
          # 9aa6597): the pinned checkout must carry exactly the digest
          # recorded at the pin — silent manifest drift fails the job.
          $expectedDigest = '3fdf9a77323705dfaf24e8f3a822b9217da20dd243e668165f4d06a9ea64676d'
          $actualDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json')).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "fc-manifest sha256 mismatch after provision: expected $expectedDigest, got $actualDigest"
          }
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      # G027 (adversarial audit, 2026-08-14): -count=1 disables the Go test
      # result cache — a cached replay would skip the conformance
      # digest/case-count assertions and the measured coverage total.
      - name: go test -count=1 -coverprofile + total-coverage threshold assertion (>= 60%)
        shell: bash
        run: |
          set -euo pipefail
          cd go
          go test -count=1 -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "total statement coverage: ${total}%"
          # G154 (adversarial audit, 2026-08-13, documented disposition):
          # the threshold sits at 60% with only a ~0.5pp buffer — the
          # measured total on 2026-08-13 was 60.5% (~300 statements above
          # the line). The threshold is intentionally NOT tightened here;
          # this gate is deliberately fragile so a coverage drop surfaces
          # loudly. Any statement-removal or test-removal PR must re-check
          # the total before landing.
          awk "BEGIN { exit !(${total} >= 60.0) }" || {
            echo "::error::total coverage ${total}% below the initial 60% threshold (initial threshold, tightened as coverage improves)"
            exit 1
          }

  go-differential:
    name: go differential vs Rust (byte parity + normalized + protocol exchange + shared conformance)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # G070 (adversarial audit, 2026-08-14): ref-pinned checkouts — the
      # Rust emitter workspace (same pin as the py/ts/kt repos) and the
      # spec repository (9aa6597, the wave-4 unified provision pin, see
      # go-matrix) must be reproducible, not whatever live HEAD carries.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema-rs
          ref: bd5734eab969fa7c8a1a1564d4ee50b85f3d10d6 # cfd6e296 519-case vendored conformance + emitter pin
          path: consema-rs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: 9aa65976d51d27f93afcffca957475368a69e93b # wave-4 unified provision pin (mother-repo HEAD; fc-manifest sha256 3fdf9a77 asserted)
          path: consema-repo
      # G070 (adversarial audit, 2026-08-14): the Rust emitter toolchain is
      # pinned to 1.97.1 — the version this harness was locally verified
      # with (钉定本机实测版本), so the differential goldens are
      # bit-reproducible (位级可复现) and independent of the runner's
      # current stable; the emitter sources come from the ref-pinned
      # consema-rs checkout above.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: consema-rs
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # Wave-4 R5 manifest sha256 assertion (unified provision pin
          # 9aa6597): the pinned checkout must carry exactly the digest
          # recorded at the pin — silent manifest drift fails the job.
          $expectedDigest = '3fdf9a77323705dfaf24e8f3a822b9217da20dd243e668165f4d06a9ea64676d'
          $actualDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json')).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "fc-manifest sha256 mismatch after provision: expected $expectedDigest, got $actualDigest"
          }
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      - name: scripts/go-verify-byte-parity.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/go-verify-byte-parity.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/go-verify-normalized-differential.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/go-verify-normalized-differential.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/go-verify-protocol-exchange.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/go-verify-protocol-exchange.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # G057 (adversarial audit, 2026-08-13): -StrictSkips is passed so the
      # "skip 必须两侧同 skip" rule of the roadmap §16.6 hard gate is
      # actually enforced — without it a one-sided documented skip passes
      # the gate.
      - name: scripts/go-verify-shared-conformance.ps1 -StrictSkips
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/go-verify-shared-conformance.ps1'
          & $script -StrictSkips
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Dependency audit (govulncheck — the official Go vulnerability scanner),
  # the standing security gate in the aggregate check (rs ci.yml shape; G135,
  # 2026-08-13). Identical to the audit.yml govulncheck job, which adds the
  # daily cron that ci-go.yml cannot express. `go run
  # golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...` downloads the pinned
  # scanner (G136 pin; the module-scoped download does not modify go.mod or
  # go.sum) and audits ./... against the live Go vulnerability database. The
  # job is unconditional (no `if:`) so it can never be skipped — a skipped
  # job in the aggregate would fail the alls-green gate (the ts allowed-skips
  # disposition: unconditional jobs need no skip allowance).
  govulncheck:
    name: govulncheck ./... (Go vuln DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
      - name: govulncheck ./... (official Go vulnerability scanner, pinned v1.6.0)
        working-directory: go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # Version-consistency gate (tokio check-readme pattern; description per
  # the step below — G073, adversarial audit 2026-08-14: the gate previously
  # hardcoded the '1.0.0-rc.1' literal, so a train bump reddened the gate
  # even after every pin was bumped): go.mod declares no package version
  # (module consema.dev/consema), so the README "Version:" line rides the
  # release train and is the single version source. The step requires the
  # line to exist and be SemVer-shaped (^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$),
  # then requires both CLI productVersion pins (go/cmd/consema-conformance/
  # main.go and go/cmd/consema/version.go, G127 extension) to equal the
  # README line exactly — a train bump must land in all three places; a
  # partial bump (README-only, or one CLI only) fails.
  check-version-consistency:
    name: check README Version line (version consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # G073 (adversarial audit, 2026-08-14): the gate previously hardcoded
      # the '1.0.0-rc.1' literal in four places, so a train bump reddened the
      # gate even after the README and both CLI productVersion pins were
      # bumped. The README "Version:" line is now the single version source:
      # the two CLI pins are compared against it, and only a SemVer-shaped
      # value is accepted (a bump that changes the version in all three
      # places passes; a partial bump still fails).
      - name: assert README.md declares the release-train Version line
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: *//p' README.md | sed 's/[（(].*//' | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::README.md does not declare a release-train Version line"
            exit 1
          fi
          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' <<<"$version"; then
            echo "::error::README Version line is not SemVer-shaped: '$version'"
            exit 1
          fi
          echo "README version line present: $version"
          grep -qF "productVersion = \"$version\"" go/cmd/consema-conformance/main.go || {
            echo "::error::go/cmd/consema-conformance/main.go does not pin productVersion = \"$version\" (must match the README Version line)"
            exit 1
          }
          echo 'conformance CLI product_version present'
          grep -qF "productVersion = \"$version\"" go/cmd/consema/version.go || {
            echo "::error::go/cmd/consema/version.go does not pin productVersion = \"$version\" (must match the README Version line)"
            exit 1
          }
          echo 'main CLI product_version present'

  # SDK examples gate: go/examples/sdk_chain is the committed five-language
  # SDK chain example (parse -> native query -> best-exact projection ->
  # semantic edit -> canonical materialization -> TOML conversion;
  # language-neutral contract reference: consema repository cookbook.md).
  # go/examples/quickstart is the repository's copy of the root README
  # quick-start snippet (parse -> query -> edit -> render), kept in sync by
  # hand — CI compiles and runs the repository copy only; it never compares
  # the copy against the README fence text (manual sync, G032-aligned)
  # (G053: the quick start previously crashed on the typed-nil *EditFailure
  # error interface trap). Both must stay vet-clean and actually run
  # (`go run` must exit 0). The examples are pure SDK chains (no conformance
  # data), so no multi-repo checkout or provision step is needed.
  examples:
    name: examples (go vet + run sdk_chain + quickstart)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
      - name: go vet ./examples/... && go run ./examples/sdk_chain ./examples/quickstart (must exit 0)
        run: cd go && go vet ./examples/... && go run ./examples/sdk_chain && go run ./examples/quickstart

  # Alls-green aggregate gate (tokio/pydantic pattern): `check (all gates
  # green)` is the SINGLE required check for branch protection on this
  # repository; every other job stays non-required. `if: always()` is
  # mandatory — otherwise GitHub skips this job when a dependency fails and
  # a skipped check can be treated as success. `jobs: ${{ toJSON(needs) }}`
  # is the action's mandatory input (it does not read the needs context
  # automatically). No job here uses continue-on-error, so the
  # allowed-failures list is empty.
  check:
    name: check (all gates green)
    if: always()
    needs: [go-matrix, go-differential, coverage, govulncheck, check-version-consistency, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: ''
          jobs: ${{ toJSON(needs) }}

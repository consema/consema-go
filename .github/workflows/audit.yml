# Dependency audit for the Go implementation (govulncheck — the official Go
# vulnerability scanner, golang.org/x/vuln), mirroring the consema-rs
# audit.yml shape (daily cron + push/PR manifest filters).
#
# go.mod is stdlib-only with zero requires (plan §1.3, asserted as
# "zero-require" in the Go implementation plan), so govulncheck reports an
# empty result today; it is wired now so that the day a dependency enters
# go.mod the standing scanner is already running. `go run
# golang.org/x/vuln/cmd/govulncheck@latest ./...` downloads the scanner
# pinned at latest (module-scoped download, it does not modify go.mod or
# go.sum) and audits the packages under ./... against the Go vulnerability
# database. Any finding fails the job (failures are red).
#
# No repository secrets are required.
name: Dependency audit (govulncheck)

on:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [main]
    paths:
      - go/go.mod
      - go/go.sum
  pull_request:
    paths:
      - go/go.mod
      - go/go.sum

concurrency:
  group: go-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck ./... (Go vuln DB, daily + manifest push/PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
      - name: govulncheck ./... (official Go vulnerability scanner)
        working-directory: go
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

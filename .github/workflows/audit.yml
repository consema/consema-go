# Dependency audit for the Go implementation (govulncheck — the official Go
# vulnerability scanner, golang.org/x/vuln). The consema-rs audit.yml is the
# standing shape (daily cron, unconditional, no manifest filters — the rs
# manifest filters were removed in the standing-check conversion; G150,
# adversarial audit 2026-08-13); this job runs the same unconditional
# schedule. The push/PR tracks are unconditional too (G135, 2026-08-13:
# the old go.mod/go.sum path filters are gone) — a standing check that
# branch protection can require; the go.mod surface is zero-require, but
# the day a dependency enters go.mod the scanner is already watching.
#
# go.mod is stdlib-only with zero requires (plan §1.3, asserted as
# "zero-require" in the Go implementation plan), so govulncheck reports an
# empty result today; it is wired now so that the day a dependency enters
# go.mod the standing scanner is already running. `go run
# golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...` downloads the scanner at
# the pinned version (G136: the old `@latest` was non-reproducible — "pinned
# at latest" is self-contradictory; the pin follows the repo's toolchain
# locking discipline; the module-scoped download does not modify go.mod or
# go.sum) and audits the packages under ./... against the Go vulnerability
# database. The database itself is fetched at run time (non-deterministic by
# design — a new advisory can fail the job at any point). Any finding fails
# this job (failures are red); the same govulncheck job is defined inside
# ci-go.yml (the rs standing shape — a needs entry must name a job in the
# same workflow), so the aggregate `check` gate now includes audit and a red
# audit blocks merge (G135).
#
# No repository secrets are required.
name: Dependency audit (govulncheck)

on:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [main]
  pull_request:

concurrency:
  group: go-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck ./... (Go vuln DB, daily + every push/PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
      - name: govulncheck ./... (official Go vulnerability scanner, pinned v1.6.0)
        working-directory: go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
